name: build-apk

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 固定 debug.keystore：否则每次构建都是新签名，覆盖安装会
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE。用显式 restore/save，
      # 保证"构建之后再存"，不会存到空目录。
      - name: Restore debug keystore
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: scenebox-debug-keystore-v2

      - name: Assemble debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save debug keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: scenebox-debug-keystore-v2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scenebox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
