name: build-apk

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # AGP 并不会把 key 放在 ~/.android/debug.keystore（实测缓存步骤报
      # Path does not exist），所以这里自己生成一把固定 key 并缓存，
      # 保证每次构建签名一致，覆盖安装不会 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      - name: Restore signing key
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/scenebox-debug.keystore
          key: scenebox-keystore-v3

      - name: Generate signing key if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/scenebox-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble debug
        run: |
          export SBOX_KEYSTORE="$HOME/scenebox-debug.keystore"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Save signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/scenebox-debug.keystore
          key: scenebox-keystore-v3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scenebox-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 混淆后崩溃栈需要 mapping.txt 才能还原，必须一并留存
      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
